<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Profesor | FQ INGENIEROS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f7f9fc; color: #0f172a; }

    /* Header */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #dce3ed;
      height: 64px;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    .top-bar .container { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; }
    .brand img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .brand strong { font-size: 13px; font-weight: 700; }

    /* Main */
    main { padding: 88px 0 60px; min-height: 100vh; }

    /* Header Card */
    .header-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      padding: 32px;
      color: white;
      margin-bottom: 24px;
    }

    .header-card h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    .header-card p { opacity: 0.9; font-size: 14px; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #dce3ed;
      overflow-x: auto;
    }

    .tab {
      padding: 12px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab:hover {
      color: #667eea;
    }

    /* Panel */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border: 1px solid #dce3ed;
      border-radius: 16px;
      padding: 24px;
      transition: all 0.2s;
    }

    .card:hover { box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
    .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    /* Tabla */
    .table-container {
      background: white;
      border: 1px solid #dce3ed;
      border-radius: 16px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f7f9fc;
      padding: 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #dce3ed;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #eef2f7;
      font-size: 14px;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover { background: #f7f9fc; }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.present { background: #d1fae5; color: #065f46; }
    .badge.absent { background: #fecaca; color: #7f1d1d; }
    .badge.pending { background: #fed7aa; color: #92400e; }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }

    .btn-outline { background: #f7f9fc; border: 1px solid #dce3ed; color: #667eea; }
    .btn-outline:hover { background: #eff6ff; border-color: #667eea; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header { margin-bottom: 24px; }
    .modal-header h2 { font-size: 20px; font-weight: 800; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #dce3ed; border-radius: 8px; font-family: inherit; font-size: 14px; }
    .form-group textarea { min-height: 120px; resize: none; }

    .modal-actions { display: flex; gap: 12px; margin-top: 32px; }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card { padding: 16px; background: #f7f9fc; border-radius: 12px; }
    .stat-card .label { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .stat-card .value { font-size: 24px; font-weight: 800; color: #667eea; }

    /* Responsive */
    @media (max-width: 768px) {
      .cards-grid { grid-template-columns: 1fr; }
      .header-card { padding: 20px; }
      .header-card h1 { font-size: 22px; }
      table { font-size: 12px; }
      th, td { padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <!-- Config + Services -->
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/professor-service.js"></script>

  <!-- Header -->
  <header class="top-bar">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/img/logo-fq.png" alt="FQ Ingenieros" />
        <div><strong>FQ INGENIEROS</strong></div>
      </a>
      <div id="userInfo" style="font-size: 14px; color: #64748b;">👨‍🏫 Profesor</div>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="container">
      <!-- Header -->
      <div class="header-card">
        <h1>Panel de Profesor</h1>
        <p>Gestiona tus cursos, estudiantes, asistencia y calificaciones</p>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('cursos')">
          <span class="material-icons-round">school</span> Mis Cursos
        </button>
        <button class="tab" onclick="switchTab('asistencia')">
          <span class="material-icons-round">check_circle</span> Asistencia
        </button>
        <button class="tab" onclick="switchTab('calificaciones')">
          <span class="material-icons-round">grade</span> Calificaciones
        </button>
        <button class="tab" onclick="switchTab('reportes')">
          <span class="material-icons-round">assessment</span> Reportes
        </button>
      </div>

      <!-- Panel: Cursos -->
      <div class="panel active" id="panel-cursos">
        <div class="cards-grid" id="cursosList"></div>
      </div>

      <!-- Panel: Asistencia -->
      <div class="panel" id="panel-asistencia">
        <div class="stats-row" id="asistenciaStats"></div>
        <div class="table-container">
          <table id="asistenciaTable">
            <thead>
              <tr>
                <th>Estudiante</th>
                <th>Sesiones Totales</th>
                <th>Presente</th>
                <th>Ausente</th>
                <th>% Asistencia</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="asistenciaBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Panel: Calificaciones -->
      <div class="panel" id="panel-calificaciones">
        <button class="btn btn-primary" onclick="cargarCalificaciones()" style="margin-bottom: 20px;">
          <span class="material-icons-round">refresh</span> Actualizar
        </button>
        <div class="table-container">
          <table id="calificacionesTable">
            <thead>
              <tr>
                <th>Estudiante</th>
                <th>Email</th>
                <th>Curso</th>
                <th>Calificación %</th>
                <th>Estatus</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="calificacionesBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Panel: Reportes -->
      <div class="panel" id="panel-reportes">
        <div class="cards-grid">
          <div class="card">
            <h2><span class="material-icons-round">download</span> Generar Reporte</h2>
            <form onsubmit="generarReporte(event)">
              <div class="form-group">
                <label>Selecciona un curso:</label>
                <select id="cursoSelect" style="width: 100%; padding: 10px; border: 1px solid #dce3ed; border-radius: 8px;">
                  <option>Cargando cursos...</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary">
                <span class="material-icons-round">description</span> Descargar CSV
              </button>
            </form>
          </div>
        </div>
        <div class="table-container" style="margin-top: 20px;">
          <table id="reportTable">
            <thead>
              <tr>
                <th>Métrica</th>
                <th>Valor</th>
              </tr>
            </thead>
            <tbody id="reportBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Feedback -->
  <div class="modal" id="feedbackModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Agregar Feedback</h2>
      </div>
      <form onsubmit="guardarFeedback(event)">
        <div class="form-group">
          <label>Estudiante:</label>
          <input type="text" id="feedbackStudent" disabled />
        </div>
        <div class="form-group">
          <label>Retroalimentación:</label>
          <textarea id="feedbackText" placeholder="Escribe tu feedback para el estudiante..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-outline" onclick="cerrarModal('feedbackModal')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script -->
  <script>
    let profesorService = null;
    let cursoActual = null;

    /**
     * Inicializar
     */
    async function init() {
      try {
        profesorService = new ProfessorService();
        const loaded = await profesorService.init();

        if (!loaded) {
          alert('No autorizado');
          window.location.href = '../auth/login.html';
          return;
        }

        document.getElementById('userInfo').textContent = `👨‍🏫 ${firebase.auth().currentUser.displayName || 'Profesor'}`;

        await cargarCursos();
      } catch (error) {
        console.error('Error inicializando:', error);
        alert('Error cargando panel de profesor');
      }
    }

    /**
     * Cargar cursos
     */
    async function cargarCursos() {
      const container = document.getElementById('cursosList');
      const selectCurso = document.getElementById('cursoSelect');

      if (profesorService.myCourses.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #94a3b8;">No hay cursos asignados</p>';
        return;
      }

      let html = '';
      let selectOptions = '';

      for (const curso of profesorService.myCourses) {
        const students = await profesorService.getStudentsByCourse(curso.id);

        html += `
          <div class="card">
            <h2>${curso.name}</h2>
            <p style="color: #64748b; margin-bottom: 12px;">${curso.description || 'Sin descripción'}</p>
            <div class="stat-card" style="background: #eff6ff; margin-bottom: 12px;">
              <div class="label">Estudiantes Matriculados</div>
              <div class="value" style="color: #667eea; font-size: 28px;">${students.length}</div>
            </div>
            <button class="btn btn-primary" onclick="selectCurso('${curso.id}', '${curso.name}')">
              <span class="material-icons-round">arrow_forward</span> Gestionar
            </button>
          </div>
        `;

        selectOptions += `<option value="${curso.id}">${curso.name}</option>`;
      }

      container.innerHTML = html;
      selectCurso.innerHTML = selectOptions;
    }

    /**
     * Seleccionar curso
     */
    async function selectCurso(cursoId, nombre) {
      cursoActual = cursoId;
      await cargarAsistencia(cursoId);
      switchTab('asistencia');
    }

    /**
     * Cargar asistencia
     */
    async function cargarAsistencia(cursoId) {
      const students = await profesorService.getStudentsByCourse(cursoId);
      const attendance = await profesorService.getAttendanceByCourse(cursoId);

      let html = '';

      for (const student of students) {
        const percent = profesorService.calculateAttendancePercentage(student.userId, cursoId, attendance);
        const studentAttendance = attendance.filter(a => a.studentId === student.userId);
        const present = studentAttendance.filter(a => a.present).length;
        const absent = studentAttendance.length - present;

        html += `
          <tr>
            <td>${student.name}</td>
            <td>${studentAttendance.length}</td>
            <td><span class="badge present">${present}</span></td>
            <td><span class="badge absent">${absent}</span></td>
            <td style="font-weight: 700; color: #667eea;">${percent}%</td>
            <td>
              <button class="btn btn-outline" onclick="abrirFeedbackModal('${student.userId}', '${student.name}', '${cursoId}')">
                <span class="material-icons-round">comment</span> Feedback
              </button>
            </td>
          </tr>
        `;
      }

      document.getElementById('asistenciaBody').innerHTML = html;

      // Stats
      const avgAttendance = Math.round(students.reduce((sum, s) => sum + profesorService.calculateAttendancePercentage(s.userId, cursoId, attendance), 0) / (students.length || 1));

      document.getElementById('asistenciaStats').innerHTML = `
        <div class="stat-card">
          <div class="label">Estudiantes</div>
          <div class="value">${students.length}</div>
        </div>
        <div class="stat-card">
          <div class="label">Asistencia Promedio</div>
          <div class="value">${avgAttendance}%</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Sesiones</div>
          <div class="value">${new Set(attendance.map(a => a.sessionNumber)).size}</div>
        </div>
      `;
    }

    /**
     * Cargar calificaciones
     */
    async function cargarCalificaciones() {
      if (!cursoActual) return;

      const grades = await profesorService.getGradesByCourse(cursoActual);
      const students = await profesorService.getStudentsByCourse(cursoActual);

      let html = '';

      for (const student of students) {
        const grade = grades.find(g => g.userId === student.userId);
        const percentage = grade?.percentage || 'N/A';
        const passed = grade?.passed;

        html += `
          <tr>
            <td>${student.name}</td>
            <td>${student.email}</td>
            <td>${student.status}</td>
            <td style="font-weight: 700;">${percentage}${typeof percentage === 'number' ? '%' : ''}</td>
            <td>
              ${passed === true ? '<span class="badge present">Aprobado</span>' : passed === false ? '<span class="badge absent">Reprobado</span>' : '<span class="badge pending">Pendiente</span>'}
            </td>
            <td>
              <button class="btn btn-outline" onclick="abrirFeedbackModal('${student.userId}', '${student.name}', '${cursoActual}')">
                <span class="material-icons-round">edit</span> Feedback
              </button>
            </td>
          </tr>
        `;
      }

      document.getElementById('calificacionesBody').innerHTML = html;
    }

    /**
     * Generar reporte
     */
    async function generarReporte(event) {
      event.preventDefault();
      const cursoId = document.getElementById('cursoSelect').value;

      const report = await profesorService.generateCourseReport(cursoId);

      if (!report) {
        alert('Error generando reporte');
        return;
      }

      // Mostrar stats
      const stats = [
        ['Estudiantes totales', report.totalStudents],
        ['Asistencia promedio', report.statistics.avgAttendance + '%'],
        ['Calificación promedio', report.statistics.avgGrade + '%'],
        ['Tasa de aprobación', report.statistics.passRate + '%'],
        ['Total sesiones', report.statistics.totalSessions]
      ];

      let html = '';
      for (const [metric, value] of stats) {
        html += `<tr><td style="font-weight: 600;">${metric}</td><td style="font-weight: 700; color: #667eea;">${value}</td></tr>`;
      }

      document.getElementById('reportBody').innerHTML = html;

      // Descargar CSV
      const csv = profesorService.exportReportToCSV(report);
      profesorService.downloadCSV(csv, `reporte-${cursoId}-${new Date().toISOString().split('T')[0]}.csv`);
    }

    /**
     * Abrir modal feedback
     */
    function abrirFeedbackModal(studentId, studentName, cursoId) {
      document.getElementById('feedbackStudent').value = studentName;
      document.getElementById('feedbackText').dataset.studentId = studentId;
      document.getElementById('feedbackText').dataset.cursoId = cursoId;
      document.getElementById('feedbackModal').classList.add('active');
    }

    /**
     * Guardar feedback
     */
    async function guardarFeedback(event) {
      event.preventDefault();
      const studentId = document.getElementById('feedbackText').dataset.studentId;
      const cursoId = document.getElementById('feedbackText').dataset.cursoId;
      const feedback = document.getElementById('feedbackText').value;

      const ok = await profesorService.addStudentFeedback(cursoId, studentId, feedback);

      if (ok) {
        alert('Feedback guardado');
        cerrarModal('feedbackModal');
        document.getElementById('feedbackText').value = '';
      } else {
        alert('Error guardando feedback');
      }
    }

    /**
     * Cerrar modal
     */
    function cerrarModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    /**
     * Cambiar tab
     */
    function switchTab(tabName) {
      // Ocultar todos los panels
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

      // Mostrar el seleccionado
      document.getElementById(`panel-${tabName}`).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'asistencia' && cursoActual) {
        cargarAsistencia(cursoActual);
      } else if (tabName === 'calificaciones' && cursoActual) {
        cargarCalificaciones();
      }
    }

    // Iniciar
    firebase.auth().onAuthStateChanged(user => {
      if (user) init();
      else window.location.href = '../auth/login.html';
    });
  </script>
</body>
</html>
