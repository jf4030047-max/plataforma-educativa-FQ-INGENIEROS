<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Exámenes | FQ INGENIEROS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f7f9fc; color: #334155; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .header { background: #fff; padding: 32px; border-radius: 14px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .header h1 { font-size: 28px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    .header p { color: #64748b; }
    .card { background: #fff; padding: 20px; border-radius: 14px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .exam-card { border-left: 4px solid #1565c0; }
    .exam-card.passed { border-left-color: #16a34a; }
    .exam-card.failed { border-left-color: #dc2626; }
    .exam-title { font-weight: 700; font-size: 16px; color: #0f172a; margin-bottom: 12px; }
    .exam-meta { display: flex; gap: 16px; margin-bottom: 12px; font-size: 14px; color: #64748b; }
    .exam-score { display: flex; align-items: center; gap: 8px; }
    .score-badge { background: #eff6ff; color: #1565c0; padding: 6px 12px; border-radius: 6px; font-weight: 600; }
    .score-badge.passed { background: #ecfdf5; color: #16a34a; }
    .score-badge.failed { background: #fef2f2; color: #dc2626; }
    .empty-state { text-align: center; padding: 40px; color: #64748b; }
    .empty-state .material-icons-round { font-size: 48px; color: #cbd5e0; display: block; margin-bottom: 12px; }
    .btn { padding: 11px 22px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .btn-primary { background: #1565c0; color: #fff; }
    .btn-primary:hover { background: #0d47a1; }
    a { color: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="../dashboard/index.html" style="color: #1565c0; text-decoration: none; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px;">
        <span class="material-icons-round" style="font-size: 20px;">arrow_back</span> Volver al dashboard
      </a>
      <h1>📝 Mis Exámenes Resueltos</h1>
      <p>Historial de exámenes completados y calificaciones</p>
    </div>

    <div id="examsContainer"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>

  <script>
    firebase.auth().onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = '../auth/login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      loadExamResults();
    });

    function loadExamResults() {
      const db = firebase.firestore();
      const user = firebase.auth().currentUser;
      const container = document.getElementById('examsContainer');

      db.collection('exam_submissions')
        .where('userId', '==', user.uid)
        .orderBy('submittedAt', 'desc')
        .get()
        .then(function(snapshot) {
          if (snapshot.empty) {
            container.innerHTML = '<div class="empty-state"><span class="material-icons-round">quiz</span><p>No has resuelto exámenes aún.</p></div>';
            return;
          }

          let html = '';
          snapshot.forEach(function(doc) {
            const sub = doc.data();
            const statusClass = sub.passed ? 'passed' : 'failed';
            const statusLabel = sub.passed ? 'Aprobado' : 'Desaprobado';
            const dateStr = new Date(sub.submittedAt.toDate()).toLocaleDateString('es-PE', {
              year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            html += `
              <div class="card exam-card ${statusClass}">
                <div class="exam-title">${escapeHtml(sub.examId)}</div>
                <div class="exam-meta">
                  <span><strong>${sub.percentage}%</strong></span>
                  <span>${dateStr}</span>
                </div>
                <div class="exam-score">
                  <span>Puntuación:</span>
                  <span class="score-badge ${statusClass}">
                    ${sub.score}/${sub.totalScore} - ${statusLabel}
                  </span>
                </div>
              </div>
            `;
          });

          container.innerHTML = html;
        })
        .catch(function(error) {
          console.error('Error:', error);
          container.innerHTML = '<div class="empty-state"><p>Error al cargar exámenes</p></div>';
        });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
