<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolver Examen | FQ INGENIEROS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .exam-container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .exam-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .exam-header h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .exam-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .exam-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 15px;
      font-size: 13px;
    }

    .info-item {
      text-align: center;
    }

    .info-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .timer {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 15px;
      text-align: center;
    }

    .timer.warning {
      color: #ff6b6b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .exam-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      font-size: 13px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #4ade80;
      transition: width 0.3s ease;
    }

    .exam-body {
      padding: 40px;
    }

    .questions-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .question-btn {
      width: 36px;
      height: 36px;
      border: 2px solid #dce3ed;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .question-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .question-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .question-btn.answered {
      border-color: #4ade80;
      background: #f0fdf4;
    }

    .question-btn.answered.active {
      background: #4ade80;
      color: white;
      border-color: #4ade80;
    }

    .question-section {
      display: none;
    }

    .question-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-title {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 20px;
    }

    .question-title strong {
      color: #667eea;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 16px;
      border: 2px solid #dce3ed;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .option input[type="radio"] {
      margin-right: 12px;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .option.selected {
      background: #f0f4ff;
      border-color: #667eea;
    }

    .option label {
      cursor: pointer;
      flex: 1;
    }

    .true-false-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .exam-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 40px;
      border-top: 1px solid #dce3ed;
      background: #f8f9fc;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f0f4ff;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #764ba2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .modal-icon.success {
      color: #4ade80;
    }

    .modal-icon.warning {
      color: #eab308;
    }

    .modal-icon.error {
      color: #ef4444;
    }

    .modal-content h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #1e293b;
    }

    .modal-content p {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .modal-score {
      font-size: 48px;
      font-weight: 700;
      color: #667eea;
      margin: 20px 0;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    .modal-buttons .btn {
      flex: 1;
    }

    .loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 1001;
      align-items: center;
      justify-content: center;
    }

    .loading.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .exam-body {
        padding: 20px;
      }

      .exam-footer {
        padding: 20px;
        flex-direction: column;
        gap: 15px;
      }

      .nav-buttons {
        width: 100%;
        flex-direction: column;
      }

      .nav-buttons .btn {
        flex: 1;
      }

      .question-btn {
        width: 32px;
        height: 32px;
        font-size: 11px;
      }

      .exam-info {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="exam-container">
    <div class="exam-header">
      <h1 id="examTitle">Cargando examen...</h1>
      <p id="examDesc">Por favor espera</p>
      
      <div class="exam-info">
        <div class="info-item">
          <strong id="totalQuestions">0</strong> preguntas
        </div>
        <div class="info-item">
          <strong id="durationInfo">0</strong> minutos
        </div>
        <div class="info-item">
          Aprobación: <strong id="passingScore">0</strong>%
        </div>
      </div>

      <div class="timer" id="timer">00:00</div>
      
      <div class="exam-progress">
        <span id="progressText">0/0 preguntas respondidas</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="exam-body">
      <div class="questions-nav" id="questionsNav"></div>
      <div id="questionsContainer"></div>
    </div>

    <div class="exam-footer">
      <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()" disabled>
          <span class="material-icons-round">arrow_back</span> Anterior
        </button>
        <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()">
          Siguiente <span class="material-icons-round">arrow_forward</span>
        </button>
      </div>
      <button class="btn btn-primary" id="submitBtn" onclick="submitExam()">
        <span class="material-icons-round">check_circle</span> Enviar Examen
      </button>
    </div>
  </div>

  <div class="modal" id="confirmSubmitModal">
    <div class="modal-content">
      <div class="modal-icon warning">
        <span class="material-icons-round">warning</span>
      </div>
      <h2>¿Enviar examen?</h2>
      <p id="unansweredMsg">Aún hay preguntas sin responder.</p>
      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmSubmit()">Enviar ahora</button>
      </div>
    </div>
  </div>

  <div class="modal" id="resultModal">
    <div class="modal-content">
      <div class="modal-icon success" id="resultIcon">
        <span class="material-icons-round">check_circle</span>
      </div>
      <h2 id="resultTitle">¡Excelente!</h2>
      <p id="resultMsg">Has aprobado el examen</p>
      <div class="modal-score" id="resultScore">85%</div>
      <p id="resultDetails">Respondiste correctamente: 17 de 20 preguntas</p>
      <div class="modal-buttons">
        <button class="btn btn-primary" onclick="goToDashboard()">
          Volver al dashboard <span class="material-icons-round">home</span>
        </button>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/exams-config.js"></script>
  <script src="../assets/js/certificate-generator.js"></script>
  <script src="../assets/js/notifications.js"></script>

  <script>
    let currentQuestion = 0;
    let examConfig = null;
    let courseId = null;
    let answers = {};
    let examStartTime = null;
    let timerInterval = null;

    document.addEventListener('DOMContentLoaded', async () => {
      courseId = new URLSearchParams(window.location.search).get('course');
      
      if (!courseId) {
        alert('No se especificó un curso');
        window.location.href = '../dashboard/index.html';
        return;
      }

      firebase.auth().onAuthStateChanged((user) => {
        if (!user) {
          window.location.href = '../auth/login.html?redirect=' + encodeURIComponent(window.location.href);
          return;
        }
        loadExam();
      });
    });

    function loadExam() {
      examConfig = getExamConfig(courseId);
      
      if (!examConfig) {
        alert('No se encontró el examen para este curso');
        window.location.href = '../dashboard/index.html';
        return;
      }

      document.getElementById('examTitle').textContent = examConfig.name;
      document.getElementById('examDesc').textContent = examConfig.description;
      document.getElementById('totalQuestions').textContent = examConfig.totalQuestions;
      document.getElementById('durationInfo').textContent = examConfig.duration;
      document.getElementById('passingScore').textContent = examConfig.passingScore;

      examStartTime = Date.now();
      startTimer();
      renderQuestions();
      showQuestion(0);
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const nav = document.getElementById('questionsNav');

      examConfig.questions.forEach((question, index) => {
        const navBtn = document.createElement('button');
        navBtn.className = 'question-btn';
        navBtn.textContent = index + 1;
        navBtn.onclick = () => showQuestion(index);
        nav.appendChild(navBtn);

        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-section';
        questionDiv.id = 'question-' + index;

        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerHTML = `<strong>Pregunta ${index + 1}:</strong> ${escapeHtml(question.text)}`;
        questionDiv.appendChild(title);

        const options = document.createElement('div');
        options.className = 'options';

        if (question.type === 'true-false') {
          options.className += ' true-false-options';
          
          ['Verdadero', 'Falso'].forEach((label, i) => {
            const option = document.createElement('label');
            option.className = 'option';
            option.innerHTML = `
              <input type="radio" name="question-${index}" value="${i}" 
                onchange="handleAnswer(${index}, ${i})">
              <span>${label}</span>
            `;
            options.appendChild(option);
          });
        } else {
          question.options.forEach((opt, i) => {
            const option = document.createElement('label');
            option.className = 'option';
            option.innerHTML = `
              <input type="radio" name="question-${index}" value="${i}" 
                onchange="handleAnswer(${index}, ${i})">
              <span>${escapeHtml(opt.text)}</span>
            `;
            options.appendChild(option);
          });
        }

        questionDiv.appendChild(options);
        container.appendChild(questionDiv);
      });
    }

    function showQuestion(index) {
      document.querySelectorAll('.question-section').forEach(el => {
        el.classList.remove('active');
      });

      document.getElementById('question-' + index).classList.add('active');
      currentQuestion = index;

      updateNav();
      updateButtons();

      if (answers[index] !== undefined) {
        const input = document.querySelector(`input[name="question-${index}"][value="${answers[index]}"]`);
        if (input) input.checked = true;
      }
    }

    function updateNav() {
      document.querySelectorAll('.question-btn').forEach((btn, index) => {
        btn.classList.remove('active', 'answered');
        if (index === currentQuestion) {
          btn.classList.add('active');
        }
        if (answers[index] !== undefined) {
          btn.classList.add('answered');
        }
      });
    }

    function updateButtons() {
      document.getElementById('prevBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').disabled = currentQuestion === examConfig.questions.length - 1;
    }

    function updateProgress() {
      const answered = Object.keys(answers).length;
      const total = examConfig.questions.length;
      const percentage = (answered / total) * 100;

      document.getElementById('progressText').textContent = `${answered}/${total} preguntas respondidas`;
      document.getElementById('progressFill').style.width = percentage + '%';
    }

    function handleAnswer(questionIndex, optionIndex) {
      answers[questionIndex] = optionIndex;
      updateProgress();
      updateNav();
    }

    function previousQuestion() {
      if (currentQuestion > 0) {
        showQuestion(currentQuestion - 1);
      }
    }

    function nextQuestion() {
      if (currentQuestion < examConfig.questions.length - 1) {
        showQuestion(currentQuestion + 1);
      }
    }

    function submitExam() {
      const answered = Object.keys(answers).length;
      const total = examConfig.questions.length;

      let msg = `Has respondido ${answered} de ${total} preguntas.`;
      if (answered < total) {
        msg += ' ¿Deseas continuar sin responder todas?';
      }

      document.getElementById('unansweredMsg').textContent = msg;
      document.getElementById('confirmSubmitModal').classList.add('active');
    }

    function closeConfirmModal() {
      document.getElementById('confirmSubmitModal').classList.remove('active');
    }

    async function confirmSubmit() {
      document.getElementById('loading').classList.add('active');
      closeConfirmModal();

      try {
        const user = firebase.auth().currentUser;
        const result = calculateScore(courseId, answers);

        const examId = 'exam_' + user.uid + '_' + courseId + '_' + Date.now();
        
        await firebase.firestore().collection('exams').doc(examId).set({
          id: examId,
          userId: user.uid,
          userEmail: user.email,
          courseId: courseId,
          courseName: examConfig.name,
          score: result.correct,
          total: result.total,
          percentage: result.percentage,
          passed: result.passed,
          answers: answers,
          completedAt: new Date(),
          createdAt: new Date()
        });

        // Obtener datos del usuario
        const userSnap = await firebase.firestore().collection('users').doc(user.uid).get();
        const userData = userSnap.data();

        // Obtener datos del curso
        const courseSnap = await firebase.firestore().collection('courses').doc(courseId).get();
        const courseData = courseSnap.data();

        // GENERAR CERTIFICADOS AUTOMÁTICAMENTE
        // 1. Generar Constancia (siempre)
        try {
          await CertificateGenerator.generateAndSave(
            {
              uid: user.uid,
              email: user.email,
              name: userData.name || user.email.split('@')[0]
            },
            {
              id: courseId,
              name: courseData.name
            },
            null,
            'constancia'
          );
        } catch (error) {
          console.warn('Error generando constancia:', error);
        }

        // 2. Generar Certificado (si aprobó)
        if (result.passed) {
          try {
            await CertificateGenerator.generateAndSave(
              {
                uid: user.uid,
                email: user.email,
                name: userData.name || user.email.split('@')[0]
              },
              {
                id: courseId,
                name: courseData.name
              },
              result,
              'certificado'
            );
          } catch (error) {
            console.warn('Error generando certificado:', error);
          }

          // Marcar enrollment como completado
          const enrollmentQuery = await firebase.firestore()
            .collection('enrollments')
            .where('userId', '==', user.uid)
            .where('courseId', '==', courseId)
            .get();

          if (!enrollmentQuery.empty) {
            const enrollmentDoc = enrollmentQuery.docs[0];
            await enrollmentDoc.ref.update({
              status: 'completed',
              completedAt: new Date(),
              progress: 100
            });
          }
        }

        showResult(result);
      } catch (error) {
        console.error('Error:', error);
        alert('Error al guardar el examen: ' + error.message);
      } finally {
        document.getElementById('loading').classList.remove('active');
      }
    }

    function showResult(result) {
      const modal = document.getElementById('resultModal');
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const msg = document.getElementById('resultMsg');
      const score = document.getElementById('resultScore');
      const details = document.getElementById('resultDetails');

      score.textContent = result.percentage + '%';
      details.textContent = `Respondiste correctamente: ${result.correct} de ${result.total} preguntas`;

      if (result.passed) {
        icon.innerHTML = '<span class="material-icons-round">check_circle</span>';
        icon.className = 'modal-icon success';
        title.textContent = '¡Excelente!';
        msg.textContent = 'Has aprobado el examen y completado el curso.';
      } else {
        icon.innerHTML = '<span class="material-icons-round">close_circle</span>';
        icon.className = 'modal-icon error';
        title.textContent = 'No aprobado';
        msg.textContent = `Necesitas ${examConfig.passingScore}% para aprobar. Puedes intentarlo nuevamente.`;
      }

      modal.classList.add('active');
    }

    function startTimer() {
      const durationMs = examConfig.duration * 60 * 1000;
      
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - examStartTime;
        const remaining = Math.max(0, durationMs - elapsed);
        const minutes = Math.floor(remaining / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);

        const timerEl = document.getElementById('timer');
        timerEl.textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

        if (minutes <= 5) {
          timerEl.classList.add('warning');
        }

        if (remaining === 0) {
          clearInterval(timerInterval);
          confirmSubmit();
        }
      }, 1000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function goToDashboard() {
      window.location.href = '../dashboard/index.html';
    }
  </script>
</body>
</html>
